name: CI

on: 
  [push, pull_request]



jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: compose check
        run: cp .env.example .env && docker compose config
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy --explicit-package-bases --ignore-missing-imports src
      
      - name: tests
        run: pytest

  ml_service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: ruff check
        run: ruff check .
      - name: tests
        run: pytest
